name: Daily Bazar Price Auto-Update

on:
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price scraper
        run: python scraper.py

      - name: Commit and push updated prices
        run: |
          git config --local user.email "utilitynest123@gmail.com"
          git config --local user.name "DD Bazar Bot"
          git add data/prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily bazar prices" && git push)
